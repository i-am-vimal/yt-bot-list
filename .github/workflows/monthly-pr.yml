name: monthly-pr

# On the 1st of each month, opens a PR from last month's contrib branch into main.
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to open the PR for, YYYY-MM (default: previous month)'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          MONTH="${MONTH_INPUT:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          if ! [[ "$MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then echo "Bad month: $MONTH"; exit 1; fi
          BRANCH="contrib/$MONTH"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "No $BRANCH branch; nothing to review."; exit 0
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR for $BRANCH already open."; exit 0
          fi

          git fetch -q origin "$BRANCH"
          CHANGES="$(git diff --name-status origin/main...FETCH_HEAD -- bots/)"
          if [ -z "$CHANGES" ]; then echo "$BRANCH has no bot changes."; exit 0; fi

          ADDED=$(grep -c '^A' <<<"$CHANGES" || true)
          MODIFIED=$(grep -c '^M' <<<"$CHANGES" || true)
          REMOVED=$(grep -c '^D' <<<"$CHANGES" || true)
          {
            echo "Bot list changes submitted by contributors during $MONTH."
            echo
            echo "- Added: $ADDED"
            echo "- Updated (new evidence): $MODIFIED"
            echo "- Removed (unmarked): $REMOVED"
            echo
            echo "Review checklist: evidence looks like bot spam, channel link opens the right account, no real people listed by mistake."
            echo "Merge during next month. Delete the branch after merging."
          } > body.md
          gh pr create --base main --head "$BRANCH" --title "Bot list: $MONTH" --body-file body.md
