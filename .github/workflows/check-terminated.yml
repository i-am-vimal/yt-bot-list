name: check-terminated

# Weekly: records channels that YouTube no longer returns (terminated) in
# status/terminated.json on main, then rebuilds the indexes.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-terminated
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch contrib branches
        run: git fetch --prune origin '+refs/heads/contrib/*:refs/remotes/origin/contrib/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/check-terminated.mjs
      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- status/terminated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/terminated.json
          git commit -q -m "Mark terminated channels"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so rebuild here.
  rebuild:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build-index.yml
    permissions:
      contents: write
