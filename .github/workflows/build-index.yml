name: build-index

# Rebuilds the indexes for main and every contrib/* branch and force-pushes them to
# the orphan `index` branch. Extension and website read from there, so generated
# files never live on main/contrib and never cause merge conflicts.
on:
  push:
    branches: [main, 'contrib/**']
    paths: ['bots/**', 'status/**', 'scripts/**']
  delete:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

# Each run rebuilds every branch, so a queued run replacing another loses nothing.
concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch contrib branches
        run: git fetch --prune origin '+refs/heads/contrib/*:refs/remotes/origin/contrib/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs "$RUNNER_TEMP/index"
      - name: Publish to index branch
        working-directory: ${{ runner.temp }}/index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Rebuild indexes from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index
